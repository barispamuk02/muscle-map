name: Account Staging Regression
on:
  push:
    branches: [feature/account-neon-auth-staging-20261016]
  pull_request:
    paths: ['account.html','account.js','account.css','account-config.js','tests/account.test.cjs','index.html','.github/workflows/account-staging.yml']
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check account.js
      - run: node --check account-config.js
      - run: node --test tests/account.test.cjs
  staging-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Browser signup login session logout
        run: node tests/account-browser.cjs
