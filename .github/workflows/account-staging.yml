name: Account Staging Regression
on:
  push:
    branches: [feature/account-neon-auth-staging-20261016]
  pull_request:
    paths: ['account.html','account.js','account.css','account-config.js','scripts/prepare-production-account-config.cjs','tests/production-account-config.test.cjs','tests/account.test.cjs','tests/account-browser.cjs','tests/staging-live.test.cjs','index.html','.github/workflows/account-staging.yml']
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check account.js
      - run: node --check account-config.js
      - run: node --check scripts/prepare-production-account-config.cjs
      - run: node --test tests/account.test.cjs tests/production-account-config.test.cjs
  staging-browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 jose@5.10.0
          npx playwright install chromium
      - name: Desktop signup login session logout + signed JWT
        run: node tests/account-browser.cjs
      - name: Mobile signup login session logout + signed JWT
        run: MOBILE_ACCOUNT=true node tests/account-browser.cjs
  live-staging-api:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Health and auth safety of separate Render staging
        run: node --test tests/staging-live.test.cjs
