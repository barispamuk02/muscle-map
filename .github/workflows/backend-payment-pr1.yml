name: Backend payment regression (PR 1)
on:
  push:
    branches:
      - ci/backend-payment-pr1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  payment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muscle_map_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d muscle_map_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout backend PR code
        uses: actions/checkout@v4
        with:
          repository: barispamuk02/muscle-map-backend
          ref: fix/premium-payment-integrity
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Audit node-postgres TLS configuration precedence
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          for (const mode of ['require','verify-full']) {
            const client = new pg.Client({
              connectionString: 'postgres://nobody:dummy@neon.example.net/app?sslmode=' + mode,
              ssl: { rejectUnauthorized: true }
            });
            const ssl=client.connectionParameters.ssl;
            console.log('TLS_CONFIG',mode,JSON.stringify(ssl));
            if (typeof ssl === 'object' && ssl.rejectUnauthorized === false) {
              throw Error('Insecure TLS validation from sslmode '+mode);
            }
          }
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check db.js
          node --check payment-events.js
          node --check webhook-transaction.js
      - name: Run offline payment unit tests
        run: node --test tests/*.test.js
      - name: Run real Postgres transaction integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/muscle_map_ci?sslmode=disable
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { initDb, getPremiumStatus, setPremium, getUserByDodoCustomer, expirePremiumIfElapsed, withWebhookTransaction } from './db.js';
          import { processDodoEvent } from './payment-events.js';
          const deps = { withWebhookTransaction, setPremium, getUserByDodoCustomer, expirePremiumIfElapsed };
          await initDb();
          const userId = 'u_ci_payment_integrity';
          const customerId = 'cus_ci_payment_integrity';
          const date = new Date(Date.now() + 30 * 86400000);
          const event = {
            type: 'payment.succeeded',
            data: { metadata: { user_id: userId }, customer: { customer_id: customerId }, next_billing_date: date.toISOString() }
          };
          const paid = await processDodoEvent(event, 'evt_ci_first', deps);
          assert.equal(paid.skipped, false);
          let status = await getPremiumStatus(userId);
          assert.equal(status.premium, true);
          assert.equal(status.expiresAt, date.toISOString());
          const duplicate = await processDodoEvent(event, 'evt_ci_first', deps);
          assert.equal(duplicate.skipped, true);
          const cancelled = await processDodoEvent({type:'subscription.cancelled', data:{customer:{customer_id:customerId}}}, 'evt_ci_cancel', deps);
          assert.equal(cancelled.skipped, false);
          assert.equal((await getPremiumStatus(userId)).premium, true);
          const earlyExpire = await processDodoEvent({type:'subscription.expired', data:{customer:{customer_id:customerId}}}, 'evt_ci_expired_early', deps);
          assert.equal(earlyExpire.skipped, false);
          assert.equal((await getPremiumStatus(userId)).premium, true);
          await assert.rejects(() => processDodoEvent({type:'payment.succeeded',data:{}},'evt_ci_invalid',deps), /cannot be matched/);
          const errorIgnored = await processDodoEvent({type:'payment.succeeded', data:{metadata:{user_id:userId},next_billing_date:date.toISOString()}}, 'evt_ci_invalid', deps);
          assert.equal(errorIgnored.skipped, false);
          const result = await getPremiumStatus(userId);
          assert.equal(result.premium, true);
          console.log('REAL_POSTGRES_TRANSACTION_OK');
          process.exit(0);
          NODE
      - name: Exercise real HTTP webhook contract against disposable Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/muscle_map_ci?sslmode=disable
          DODO_WEBHOOK_SECRET: whsec_MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          ALLOWED_ORIGINS: https://muscle-map.app
          PORT: 3333
        run: |
          node server.js >/tmp/muscle-map-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const url='http://127.0.0.1:3333';
          let ready=false;
          for(let i=0;i<50;i++) {
            try {
              const res=await fetch(url+'/health');
              if(res.ok) { ready=true; break; }
            } catch {}
            await new Promise(r=>setTimeout(r,200));
          }
          assert.equal(ready,true,'server must start against disposable Postgres');
          const now=Math.floor(Date.now()/1000).toString();
          const eventId='evt_ci_http_1';
          const next=new Date(Date.now()+28*86400000).toISOString();
          const payload=JSON.stringify({type:'payment.succeeded',data:{metadata:{user_id:'u_ci_http_user_1'},next_billing_date:next}});
          const secret=Buffer.from('12345678901234567890123456789012');
          const signed=crypto.createHmac('sha256',secret).update(eventId+'.'+now+'.').update(payload).digest('base64');
          const options={method:'POST',headers:{'content-type':'application/json','webhook-id':eventId,'webhook-timestamp':now,'webhook-signature':'v1,'+signed},body:payload};
          const bad=await fetch(url+'/api/webhook/dodo',{...options,headers:{...options.headers,'webhook-signature':'v1,invalid'}});
          assert.equal(bad.status,401);
          const success=await fetch(url+'/api/webhook/dodo',options);
          assert.equal(success.status,200);
          assert.deepEqual(await success.json(),{ok:true,skipped:false});
          const duplicate=await fetch(url+'/api/webhook/dodo',options);
          assert.equal(duplicate.status,200);
          assert.deepEqual(await duplicate.json(),{ok:true,skipped:true});
          const status=await fetch(url+'/api/premium/u_ci_http_user_1',{headers:{origin:'https://muscle-map.app'}});
          assert.equal(status.status,200);
          assert.equal(status.headers.get('access-control-allow-origin'),'https://muscle-map.app');
          const entitlement=await status.json();
          assert.equal(entitlement.premium,true);
          assert.equal(entitlement.expiresAt,next);
          const invalidCheckout=await fetch(url+'/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:'bad!'})});
          assert.equal(invalidCheckout.status,400);
          console.log('HTTP_WEBHOOK_CORS_ENTITLEMENT_OK');
          process.exit(0);
          NODE
      - name: Scope verification
        run: echo "No Neon credentials, Dodo API calls, or production deployments used."
