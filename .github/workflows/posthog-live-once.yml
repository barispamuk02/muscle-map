name: One-time PostHog live analytics verification
on:
  push:
    branches:
      - test/posthog-real-browser-smoke
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Verify production PostHog pageview bootstrap and one synthetic ingestion
        run: node tests/live-analytics-check.cjs
