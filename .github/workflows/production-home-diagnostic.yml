name: Public Production Homepage Diagnostic
on:
  push:
    branches: [diagnostic/production-home-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Diagnose published production homepage, no login or payment
        run: node tests/production-home-diagnostic.cjs
