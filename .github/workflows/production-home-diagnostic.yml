name: Production Homepage Browser Regression
on:
  push:
    branches: [diagnostic/production-home-20261016, main]
    paths: ['script.js','index.html','service-worker.js','tests/production-home-diagnostic.cjs','.github/workflows/production-home-diagnostic.yml']
  pull_request:
    paths: ['script.js','index.html','service-worker.js','tests/production-home-diagnostic.cjs','.github/workflows/production-home-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Diagnose published production homepage, no login or payment
        run: LOCAL_CANDIDATE=true node tests/production-home-diagnostic.cjs
      - name: Verify corrected PUBLIC site after GitHub Pages deployment, no login or charge
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 50); do
            if curl -fsS --connect-timeout 8 --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/muscle-map-prod-script.js 'https://muscle-map.app/script.js' && grep -q 'Initialize before any top-level Premium UI checks execute' /tmp/muscle-map-prod-script.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          node tests/production-home-diagnostic.cjs

