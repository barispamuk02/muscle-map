name: Muscle Map regression
on:
  push:
    branches:
      - fix/premium-payment-integrity
  pull_request:
    paths:
      - 'script.js'
      - 'posthog-analytics.js'
      - 'service-worker.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/regression.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/regression.test.cjs tests/posthog-analytics.test.cjs
